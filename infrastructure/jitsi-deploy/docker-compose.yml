version: '3.8'

# ============================================================
#  EduMeet — Self-Hosted Jitsi Meet Stack
#  Các thành phần: web (nginx), prosody (XMPP),
#                  jicofo (Focus), jvb (Videobridge)
#
#  Tùy chỉnh từ jitsi-meet/ source:
#  - custom/interface_config.js  → Thương hiệu EduMeet
#  - custom/main-vi.json         → Giao diện tiếng Việt
# ============================================================

services:

  # ----------------------------------------------------------
  # 1. Web UI + Nginx Reverse Proxy (TLS termination)
  # ----------------------------------------------------------
  web:
    image: jitsi/web:stable-9457
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ${CONFIG:-./config}/web:/config:Z
      - ${CONFIG:-./config}/web/crontabs:/var/spool/cron/crontabs:Z
      - ${CONFIG:-./config}/transcripts:/usr/share/jitsi-meet/transcripts:Z
      # -------------------------------------------------------
      # Mount tùy chỉnh từ jitsi-meet/ source (lấy từ repo)
      # -------------------------------------------------------
      # Thương hiệu EduMeet (tên app, tắt logo Jitsi)
      - ./custom/interface_config.js:/usr/share/jitsi-meet/interface_config.js:ro
      # Ngôn ngữ Tiếng Việt hoàn chỉnh
      - ./custom/main-vi.json:/usr/share/jitsi-meet/lang/main-vi.json:ro
      # Cấu hình Jitsi tùy chỉnh (P2P tắt, toolbar lớp học, vi mặc định)
      - ./custom/config.js:/defaults/config.js:ro
    environment:
      - AMPLITUDE_ID
      - ANALYTICS_SCRIPT_URLS
      - ANALYTICS_WHITELISTED_EVENTS
      - CALLSTATS_CUSTOM_SCRIPT_URL
      - CALLSTATS_ID
      - CALLSTATS_SECRET
      - CHROME_EXTENSION_BANNER_JSON
      - CONFCODE_URL
      - CONFIG_EXTERNAL_CONNECT
      - DEFAULT_LANGUAGE=vi
      - DEPLOYMENTINFO_ENVIRONMENT
      - DEPLOYMENTINFO_ENVIRONMENT_TYPE
      - DEPLOYMENTINFO_REGION
      - DEPLOYMENTINFO_SHARD
      - DEPLOYMENTINFO_USERREGION
      - DIALIN_NUMBERS_URL
      - DIALOUT_AUTH_URL
      - DIALOUT_CODES_URL
      - DISABLE_DEEP_LINKING
      - DISABLE_HTTPS
      - DOCKER_HOST_ADDRESS=${DOCKER_HOST_ADDRESS}
      - DROPBOX_APPKEY
      - DROPBOX_REDIRECT_URI
      - DYNAMIC_BRANDING_URL
      - ENABLE_APPLE_OAUTH
      - ENABLE_AUTH
      - ENABLE_BREAKOUT_ROOMS
      - ENABLE_CALENDAR
      - ENABLE_COLIBRI_WEBSOCKET
      - ENABLE_E2EPING
      - ENABLE_FILE_RECORDING_SERVICE
      - ENABLE_FILE_RECORDING_SERVICE_SHARING
      - ENABLE_FLOC
      - ENABLE_GUESTS
      - ENABLE_HSTS
      - ENABLE_HTTP_REDIRECT
      - ENABLE_IPV6
      - ENABLE_LETSENCRYPT
      - ENABLE_LIPSYNC
      - ENABLE_NO_AUDIO_DETECTION
      - ENABLE_NOISY_MIC_DETECTION
      - ENABLE_OCTO
      - ENABLE_OPUS_RED
      - ENABLE_PARTICIPANTS_STATS
      - ENABLE_PREJOIN_PAGE
      - ENABLE_P2P
      - ENABLE_WELCOME_PAGE
      - ENABLE_CLOSE_PAGE
      - ENABLE_RECORDING
      - ENABLE_REMB
      - ENABLE_REQUIRE_DISPLAY_NAME
      - ENABLE_SERVICE_RECORDING
      - ENABLE_SIMULCAST
      - ENABLE_STATS_ID
      - ENABLE_STEREO
      - ENABLE_SUBDOMAINS
      - ENABLE_TALK_WHILE_MUTED
      - ENABLE_TCC
      - ENABLE_TRANSCRIPTIONS
      - ETHERPAD_PUBLIC_URL
      - ETHERPAD_URL
      - GIPHY_ENABLED
      - GOOGLE_ANALYTICS_ID
      - GOOGLE_API_APP_CLIENT_ID
      - INVITE_SERVICE_URL
      - JICOFO_AUTH_USER
      - LETSENCRYPT_DOMAIN
      - LETSENCRYPT_EMAIL
      - LETSENCRYPT_USE_STAGING
      - MATOMO_ENDPOINT
      - MATOMO_SITE_ID
      - MICROSOFT_API_APP_CLIENT_ID
      - NGINX_RESOLVER
      - NGINX_WORKER_PROCESSES
      - NGINX_WORKER_CONNECTIONS
      - PEOPLE_SEARCH_URL
      - PUBLIC_URL=${PUBLIC_URL}
      - P2P_PREFERRED_CODEC
      - RESOLUTION
      - RESOLUTION_MIN
      - RESOLUTION_WIDTH
      - RESOLUTION_WIDTH_MIN
      - START_AUDIO_MUTED
      - START_AUDIO_ONLY
      - START_BITRATE
      - START_SILENT
      - START_VIDEO_MUTED
      - TESTING_CAP_SCREENSHARE_BITRATE
      - TESTING_OCTO_PROBABILITY
      - TOKEN_AUTH_URL
      - VIDEOQUALITY_BITRATE_MULTIMEDIA_LOW
      - VIDEOQUALITY_BITRATE_MULTIMEDIA_STANDARD
      - VIDEOQUALITY_BITRATE_MULTIMEDIA_HIGH
      - VIDEOQUALITY_BITRATE_PLAYBACK_LOW
      - VIDEOQUALITY_BITRATE_PLAYBACK_STANDARD
      - VIDEOQUALITY_BITRATE_PLAYBACK_HIGH
      - VIDEOQUALITY_ENFORCE_PREFERRED_CODEC
      - VIDEOQUALITY_PREFERRED_CODEC
      - XMPP_AUTH_DOMAIN
      - XMPP_BOSH_URL_BASE
      - XMPP_DOMAIN
      - XMPP_GUEST_DOMAIN
      - XMPP_MUC_DOMAIN
      - XMPP_RECORDER_DOMAIN
      - XMPP_PORT
    networks:
      meet.jitsi:
        aliases:
          - ${XMPP_DOMAIN}

  # ----------------------------------------------------------
  # 2. Prosody — XMPP Signaling Server
  # ----------------------------------------------------------
  prosody:
    image: jitsi/prosody:stable-9457
    restart: unless-stopped
    expose:
      - "${XMPP_PORT:-5222}"
      - "5280"
      - "5347"
    volumes:
      - ${CONFIG:-./config}/prosody/config:/config:Z
      - ${CONFIG:-./config}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
    environment:
      - AUTH_TYPE
      - DISABLE_POLLS
      - ENABLE_AUTH
      - ENABLE_AV_MODERATION
      - ENABLE_BREAKOUT_ROOMS
      - ENABLE_END_CONFERENCE
      - ENABLE_GUESTS
      - ENABLE_IPV6
      - ENABLE_LOBBY
      - ENABLE_RECORDING
      - ENABLE_SUBDOMAINS
      - ENABLE_XMPP_WEBSOCKET
      - GLOBAL_CONFIG
      - GLOBAL_MODULES
      - JICOFO_COMPONENT_SECRET
      - JICOFO_AUTH_USER
      - JICOFO_AUTH_PASSWORD
      - JVB_AUTH_USER
      - JVB_AUTH_PASSWORD
      - JIBRI_XMPP_USER
      - JIBRI_XMPP_PASSWORD
      - JIBRI_RECORDER_USER
      - JIBRI_RECORDER_PASSWORD
      - JIGASI_XMPP_USER
      - JIGASI_XMPP_PASSWORD
      - JWT_APP_ID
      - JWT_APP_SECRET
      - JWT_ACCEPTED_ISSUERS
      - JWT_ACCEPTED_AUDIENCES
      - JWT_ASAP_KEYSERVER
      - JWT_ALLOW_EMPTY
      - JWT_AUTH_TYPE
      - JWT_TOKEN_AUTH_MODULE
      - MATRIX_UVS_URL
      - MATRIX_UVS_ISSUER
      - MATRIX_UVS_AUTH_TOKEN
      - MATRIX_UVS_SYNC_POWER_LEVELS
      - LOG_LEVEL
      - LDAP_AUTH_METHOD
      - LDAP_BASE
      - LDAP_BINDDN
      - LDAP_BINDPW
      - LDAP_FILTER
      - LDAP_VERSION
      - LDAP_TLS_CIPHERS
      - LDAP_TLS_CHECK_PEER
      - LDAP_TLS_CACERT_FILE
      - LDAP_TLS_CACERT_DIR
      - LDAP_START_TLS
      - LDAP_URL
      - LDAP_USE_TLS
      - MAX_PARTICIPANTS
      - PROSODY_RESERVATION_ENABLED
      - PROSODY_RESERVATION_REST_BASE_URL
      - PUBLIC_URL
      - TURN_CREDENTIALS
      - TURN_HOST
      - TURNS_HOST
      - TURN_PORT
      - TURNS_PORT
      - TURN_TRANSPORT
      - TZ
      - XMPP_DOMAIN
      - XMPP_AUTH_DOMAIN
      - XMPP_GUEST_DOMAIN
      - XMPP_MUC_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - XMPP_MODULES
      - XMPP_MUC_MODULES
      - XMPP_INTERNAL_MUC_MODULES
      - XMPP_RECORDER_DOMAIN
      - XMPP_PORT
    networks:
      meet.jitsi:
        aliases:
          - ${XMPP_SERVER}

  # ----------------------------------------------------------
  # 3. Jicofo — Conference Focus Component
  # ----------------------------------------------------------
  jicofo:
    image: jitsi/jicofo:stable-9457
    restart: unless-stopped
    volumes:
      - ${CONFIG:-./config}/jicofo:/config:Z
    environment:
      - AUTH_TYPE
      - BRIDGE_AVG_PARTICIPANT_STRESS
      - BRIDGE_STRESS_THRESHOLD
      - ENABLE_AUTH
      - ENABLE_AUTO_OWNER
      - ENABLE_CODEC_VP8
      - ENABLE_CODEC_VP9
      - ENABLE_CODEC_H264
      - ENABLE_CODEC_OPUS_RED
      - ENABLE_OCTO
      - ENABLE_RECORDING
      - ENABLE_SCTP
      - ENABLE_TRICKLE_ICE
      - JICOFO_AUTH_USER
      - JICOFO_AUTH_PASSWORD
      - JICOFO_ENABLE_BRIDGE_HEALTH_CHECKS
      - JICOFO_CONF_INITIAL_PARTICIPANT_WAIT_TIMEOUT
      - JICOFO_CONF_SINGLE_PARTICIPANT_TIMEOUT
      - JICOFO_ENABLE_ICE_FAILURE_DETECTION
      - JICOFO_HEALTH_CHECKS_USE_PRESENCE
      - JICOFO_MAX_MEMORY
      - JICOFO_RESERVATION_REST_BASE_URL
      - JICOFO_SHORT_ID
      - JIBRI_BREWERY_MUC
      - JIBRI_PENDING_TIMEOUT
      - JIBRI_XMPP_USER
      - JIBRI_XMPP_PASSWORD
      - JIGASI_BREWERY_MUC
      - JIGASI_XMPP_USER
      - JIGASI_XMPP_PASSWORD
      - JVB_BREWERY_MUC
      - MAX_BRIDGE_PARTICIPANTS
      - OCTO_BRIDGE_SELECTION_STRATEGY
      - SENTRY_DSN="${JICOFO_SENTRY_DSN:-0}"
      - SENTRY_ENVIRONMENT
      - SENTRY_RELEASE
      - TZ
      - XMPP_DOMAIN
      - XMPP_AUTH_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - XMPP_MUC_DOMAIN
      - XMPP_SERVER
      - XMPP_PORT
    depends_on:
      - prosody
    networks:
      meet.jitsi:

  # ----------------------------------------------------------
  # 4. JVB — Jitsi Videobridge (Media Routing)
  # ----------------------------------------------------------
  jvb:
    image: jitsi/jvb:stable-9457
    restart: unless-stopped
    ports:
      # UDP port for WebRTC media — PHẢI mở firewall cho port này!
      - "${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp"
      # TCP fallback
      - "${JVB_TCP_PORT:-4443}:4443"
    volumes:
      - ${CONFIG:-./config}/jvb:/config:Z
    environment:
      - DOCKER_HOST_ADDRESS=${DOCKER_HOST_ADDRESS}
      - ENABLE_COLIBRI_WEBSOCKET
      - ENABLE_OCTO
      - ENABLE_MULTI_STREAM
      - JVB_ADVERTISE_IPS=${JVB_ADVERTISE_IPS}
      - JVB_ADVERTISE_PRIVATE_CANDIDATES
      - JVB_AUTH_USER
      - JVB_AUTH_PASSWORD
      - JVB_BREWERY_MUC
      - JVB_DISABLE_STUN
      - JVB_PORT
      - JVB_MUC_NICKNAME
      - JVB_STUN_SERVERS
      - JVB_WS_DOMAIN
      - JVB_WS_SERVER_ID
      - PUBLIC_URL
      - SENTRY_DSN="${JVB_SENTRY_DSN:-0}"
      - SENTRY_ENVIRONMENT
      - SENTRY_RELEASE
      - COLIBRI_REST_ENABLED
      - SHUTDOWN_REST_ENABLED
      - TZ
      - XMPP_AUTH_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - XMPP_SERVER
      - XMPP_PORT
    depends_on:
      - prosody
    networks:
      meet.jitsi:

  # ----------------------------------------------------------
  # 5. Frontend UI — EduMeet React App (Vite)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ../../app
      dockerfile: Dockerfile
      args:
        - VITE_JITSI_HOST=${DOCKER_HOST_ADDRESS}
        - VITE_JITSI_PORT=${HTTPS_PORT:-8443}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    depends_on:
      - web
    networks:
      meet.jitsi:

# ----------------------------------------------------------
# Internal network (cách ly các services với nhau)
# ----------------------------------------------------------
networks:
  meet.jitsi:
    driver: bridge
    internal: false
