version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2023-10-25T06-33-25Z
    container_name: minio-storage
    restart: unless-stopped
    ports:
      # S3 API port
      - "9000:9000"
      # Console admin UI port
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadminpassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  egress:
    image: livekit/egress:v1.7
    container_name: livekit-egress-worker
    restart: unless-stopped
    # Egress runs headless Chrome instances for room recording.
    # It requires CAP_SYS_ADMIN capabilities for sandbox operations inside containers.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./egress.yaml:/etc/egress.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: --config /etc/egress.yaml
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  minio_data:
