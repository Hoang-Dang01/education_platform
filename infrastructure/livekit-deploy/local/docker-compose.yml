version: '3.8'

services:
  livekit:
    image: livekit/livekit-server:v1.5
    container_name: livekit-local
    restart: unless-stopped
    ports:
      # HTTP API & WebSockets signaling
      - "7880:7880"
      # WebRTC TCP fallback
      - "7881:7881"
      # TURN / coturn fallback (Local)
      - "7882:7882"
      # ICE UDP media ports range
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
