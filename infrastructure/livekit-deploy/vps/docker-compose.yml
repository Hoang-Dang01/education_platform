version: '3.8'

services:
  livekit:
    image: livekit/livekit-server:v1.5
    container_name: livekit-server
    restart: unless-stopped
    ports:
      # HTTP API & WebSockets signaling (accessed via Caddy reverse proxy)
      - "7880:7880"
      # WebRTC TCP fallback
      - "7881:7881"
      # ICE UDP media ports range
      - "50000-50200:50000-50200/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    depends_on:
      - coturn
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: coturn-server
    restart: unless-stopped
    ports:
      # STUN/TURN listening ports (TCP & UDP)
      - "3478:3478"
      - "3478:3478/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf
    # Runs coturn server with the mounted config file
    command: -c /etc/coturn/turnserver.conf
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.7
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 / QUIC support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - livekit
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
