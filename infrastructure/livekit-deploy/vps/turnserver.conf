# Listening ports for STUN/TURN traffic
listening-port=3478
listening-ip=0.0.0.0

# Public IP address of the VPS (Crucial for NAT traversal)
external-ip=your-vps-public-ip # Replace with your actual VPS public IP address

# Ports range allocated for WebRTC peer-to-peer relaying
min-port=55000
max-port=56000

# TURN settings & Long-Term Credentials Mechanism
fingerprint
lt-cred-mech
stale-nonce=600

# Static User Account credentials (matching TURN servers candidates list in livekit.yaml)
user=edumeetuser:edumeetpass

# Domain identifier acting as host realm
realm=livekit.yourdomain.com # Replace with your domain name

# Security and Traversal Optimizations
no-multicast-peers
no-cli
no-loopback-peers
verbose
